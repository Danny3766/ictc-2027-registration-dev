<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>2027 國際華語相調特會｜38 會所登記</title>
    <meta name="description" content="38 會所聖徒登記報名：聚會時間、住宿、用餐、接送一次填寫。" />
    <meta property="og:title" content="2027 國際華語相調特會｜38 會所登記" />
    <meta property="og:description" content="38 會所聖徒登記報名：聚會時間、住宿、用餐、接送一次填寫。" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./config.js"></script>
    <script src="./hosting.js" defer></script>
    <script src="./pickup.js" defer></script>
    <script src="./meals.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="container">
      <p id="test-banner" class="test-banner" hidden></p>
      <header class="hero">
        <p class="eyebrow">38 會所聖徒登記報名</p>
        <h1 id="event-name">2027 國際華語相調特會</h1>
        <p id="event-meta"></p>
        <p id="event-note" class="event-note" hidden></p>
      </header>

      <p id="page-message" class="message" role="status" hidden></p>

      <section
        class="card"
        id="program-section"
        aria-labelledby="program-title"
        hidden
      >
        <h2 id="program-title">聚會時間表</h2>
        <div id="program" class="program-calendar"></div>
      </section>

      <section class="card" aria-label="登記服務">
        <div class="tabs" role="tablist" aria-label="登記服務">
          <button type="button" id="register-tab" role="tab" aria-controls="register-panel" aria-selected="true" tabindex="0">登記參加</button>
          <button type="button" id="query-tab" role="tab" aria-controls="query-panel" aria-selected="false" tabindex="-1">查詢或修改登記</button>
        </div>
        <div id="register-panel" role="tabpanel" aria-labelledby="register-tab">
        <!-- autocomplete="off" on the names: browsers otherwise refill the previous person's name after a reload or 上一頁 on a shared device. -->
        <form id="registration-form">
          <div class="identity-fields with-child">
            <label
              >姓名<input
                name="full_name"
                maxlength="100"
                autocomplete="off"
                required
            /></label>
            <label
              >區<select name="district_id" required>
                <option value="">請選擇</option>
              </select></label
            >
            <label class="child-check"><input type="checkbox" name="is_child" />兒童</label>
          </div>
          <p class="hint child-hint" hidden>兒童報名請在表單最下方填寫家長姓名。</p>
          <fieldset id="hosting-section" class="hosting-section" hidden>
            <legend>開家接待</legend>
            <div class="hosting-survey">
              <p class="hint hosting-description" hidden></p>
              <p class="hint">同一家只需一人登記開家接待，其他家人請選「家人已登記開家接待」。</p>
              <div id="hosting-fields"></div>
            </div>
            <div class="pickup-survey">
              <p class="pickup-heading" hidden>接機接待</p>
              <p class="hint pickup-description" hidden></p>
              <div id="pickup-fields"></div>
            </div>
          </fieldset>
          <fieldset>
            <legend>活動選擇</legend>
            <p class="hint">請為每項活動選擇參加或不參加，報名截止前都可以修改登記</p>
            <div id="activities"></div>
          </fieldset>
          <label class="parent-name" hidden>家長姓名<input name="parent_name" maxlength="20" autocomplete="off" required disabled /></label>
          <label class="honeypot" aria-hidden="true"
            >網站<input name="website" tabindex="-1" autocomplete="off"
          /></label>
          <button type="submit">送出登記</button>
        </form>
        </div>
        <div id="query-panel" role="tabpanel" aria-labelledby="query-tab" hidden>
        <form id="query-form">
          <p class="hint">請輸入登記時的姓名與區；姓名寫法須與登記時相同，大小寫與空白不影響查詢。</p>
          <div class="identity-fields">
            <label>姓名<input name="full_name" maxlength="100" autocomplete="off" required /></label>
            <label>區<select name="district_id" required>
                <option value="">請選擇</option>
              </select></label>
          </div>
          <button type="submit">查詢</button>
        </form>
        <form id="edit-form" hidden>
          <div class="identity-fields with-child">
            <label>姓名<input id="edit-full-name" readonly /></label>
            <label>區<input id="edit-district" readonly /></label>
            <label class="child-check"><input type="checkbox" name="is_child" disabled />兒童</label>
          </div>
          <p class="hint child-hint" hidden>兒童報名請在表單最下方填寫家長姓名。</p>
          <p class="hint">姓名或區需要更正時，請聯絡服事者。</p>
          <p id="edit-mode-hint" class="hint" hidden>正在修改登記內容。</p>
          <fieldset id="edit-hosting-section" class="hosting-section" hidden>
            <legend>開家接待與接機接待</legend>
            <p class="hint hosting-description" hidden></p>
            <p class="hint pickup-description" hidden></p>
            <div id="edit-hosting"></div>
            <div class="pickup-survey" id="edit-pickup-survey">
              <p class="pickup-heading" hidden>接機接待</p>
              <div id="edit-pickup"></div>
            </div>
          </fieldset>
          <fieldset>
            <legend>活動選擇</legend>
            <div id="edit-activities"></div>
          </fieldset>
          <label class="parent-name" hidden>家長姓名<input name="parent_name" maxlength="20" autocomplete="off" required readonly /></label>
          <div class="actions">
            <button id="start-edit" type="button">修改登記內容</button>
            <button id="save-edit" type="submit" hidden disabled>儲存修改</button>
            <button id="cancel-edit" type="button" class="secondary" hidden>取消修改</button>
          </div>
        </form>
        </div>
      </section>
    </main>
  </body>
</html>
